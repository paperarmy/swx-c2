<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SWx-C2 우주기상 지휘통신 영향판단 보드</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>SWx-C2 <span class="subtitle">우주기상 지휘통신 영향판단</span></h1>
    <div class="who">
      <button id="theme-toggle" type="button" data-tip="어두운 상황실 테마와 발표용 밝은 테마를 바꿉니다." tabindex="0">밝은 테마</button>
      <span id="who-box" hidden>
        <span id="who-name"></span>
        <a id="admin-link" href="admin.html" hidden>사용자 관리</a>
        <button id="logout" type="button">로그아웃</button>
      </span>
    </div>
  </header>

  <main>
    <!-- Supabase 설정 전 -->
    <section id="view-config" class="panel narrow" hidden>
      <p>Supabase 설정이 없습니다. <code>js/config.js</code>에 프로젝트 URL과 anon 키를 넣어 주세요.</p>
    </section>

    <!-- 로그인·가입 -->
    <section id="view-login" class="panel narrow" hidden>
      <div class="tabs" role="tablist">
        <button id="tab-login" role="tab" aria-selected="true">로그인</button>
        <button id="tab-signup" role="tab" aria-selected="false">가입 신청</button>
      </div>
      <form id="auth-form">
        <div id="name-field" hidden>
          <label for="display-name">표시 이름</label>
          <input id="display-name" autocomplete="nickname" maxlength="40">
        </div>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">비밀번호(6자 이상)</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <div class="row"><button class="primary" id="auth-submit" type="submit">로그인</button></div>
        <p class="msg" id="auth-msg" role="status"></p>
      </form>
      <p class="msg">부대명·장비명 등 군 내부 정보는 입력하지 마십시오.</p>
    </section>

    <!-- 승인 대기·정지 -->
    <section id="view-pending" class="panel narrow" hidden>
      <p id="pending-text"></p>
    </section>

    <!-- 승인 사용자 -->
    <section id="view-app" hidden>
      <div id="status" class="panel status"><div class="skeleton">데이터를 불러오는 중…</div></div>
      <p class="msg" id="data-msg" role="status"></p>
      <nav class="tabs main-tabs" role="tablist">
        <button role="tab" data-tab="tab-brief" aria-selected="true">1 지휘관 브리핑</button>
        <button role="tab" data-tab="tab-matrix" aria-selected="false">2 영향 매트릭스</button>
        <button role="tab" data-tab="tab-pace" aria-selected="false">3 PACE 권고</button>
        <button role="tab" data-tab="tab-diagnose" aria-selected="false">4 장애 원인 판별</button>
        <button role="tab" data-tab="tab-replay" aria-selected="false">5 과거 사례 재현</button>
        <button role="tab" data-tab="tab-outlook" aria-selected="false">6 장차 전망</button>
      </nav>
      <div id="replay-banner" class="replay-banner" role="status" hidden>
        <span id="replay-banner-text"></span>
        <button id="replay-exit" type="button">실시간으로 돌아가기</button>
      </div>
      <div id="tab-brief" role="tabpanel"><div class="panel skeleton">데이터를 불러오는 중…</div></div>
      <div id="tab-matrix" role="tabpanel" hidden></div>
      <div id="tab-pace" role="tabpanel" hidden></div>
      <div id="tab-diagnose" role="tabpanel" hidden></div>
      <div id="tab-replay" role="tabpanel" hidden></div>
      <div id="tab-outlook" role="tabpanel" hidden></div>
    </section>
  </main>

  <footer>
    공개 데이터 기반 시제품 · 공식 예·경보가 있으면 공식 예·경보를 우선합니다.<br>
    출처: NOAA SWPC, GFZ Potsdam(CC BY 4.0), 한국천문연구원 · 용어 위에 마우스를 올리면 설명이 나옵니다.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
