<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SWx-C2 사용자 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>SWx-C2 사용자 관리</h1>
    <div class="who"><a href="index.html">보드로 돌아가기</a></div>
  </header>

  <main>
    <section class="panel">
      <div class="row">
        <button data-filter="pending" aria-selected="true">승인 대기</button>
        <button data-filter="all">전체</button>
        <button id="reload">새로고침</button>
      </div>
      <p class="msg" id="admin-msg" role="status"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>이메일</th><th>표시 이름</th><th>역할</th><th>상태</th><th>가입(KST)</th><th>조치</th></tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </section>
    <p class="msg">권한 변경은 DB 함수에서 다시 확인합니다. 마지막 활성 관리자는 해제하거나 정지할 수 없습니다.</p>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
